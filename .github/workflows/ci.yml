name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.12"

      - name: Research adapter checks
        run: |
          python -m pip install -r packages/headless/python/requirements.txt
          python packages/headless/python/test_adapter.py

      - name: Install Chromium
        run: pnpm --filter @dglz/web exec playwright install --with-deps chromium

      - name: Browser checks
        run: pnpm --filter @dglz/web test:browser
